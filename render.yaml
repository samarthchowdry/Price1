services:
  - type: web
    name: silver-ornament-calculator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEFAULT_GST_PERCENT
        value: "3"
      - key: SECRET_KEY
        generateValue: true
